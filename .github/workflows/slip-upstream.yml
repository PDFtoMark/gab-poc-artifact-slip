name: Check External Links

# PoC stand-in for the attacker-controlled upstream run whose name the target's
# workflow_run trigger watches (a fork PR can supply a workflow with this name).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  forge:
    name: Forge attacker artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/forge