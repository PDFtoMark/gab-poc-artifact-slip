name: Upload crafted artifact
description: Uploads an artifact whose zip entry names contain ".." components (the official upload action cannot create these).
inputs:
  name:
    default: fork-www-dist
  pairs:
    description: "comma-separated source->target pairs (target relative to the consumer workspace)"
    default: "payload/deploy.sh->scripts/deploy.sh"
  extract-dir:
    default: fork-www-dist
runs:
  using: node20
  main: plant-artifact.js
